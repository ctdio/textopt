name: release

on:
  push:
    branches: [main]

# Two releases must never publish at once, and cancelling one mid-publish would
# leave the registry and the git tags disagreeing.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit, the tags, and the releases
      pull-requests: write # open and update the version pull request
      id-token: write # sign the published tarballs with npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc that reads NODE_AUTH_TOKEN. The action stopped
          # handling npm credentials itself in v2.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # ci.yml runs on the same push, but nothing orders it before publishing,
      # and the version pull request gets no ci run of its own: GitHub does not
      # trigger workflows for events raised by the default token.
      - run: pnpm test

      - uses: changesets/action@v2
        with:
          # Versioning rewrites the workspace package.json files, so the
          # lockfile has to be refreshed or the next ci run fails frozen.
          version-script: pnpm changeset version && pnpm install --no-frozen-lockfile
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
