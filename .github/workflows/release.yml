name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Every push to main used to raise a deployment review on the `npm`
  # environment, docs-only ones included. An environment gate stops a job
  # before its first step, so the release job could not work out that it had
  # nothing to do without first asking to be approved. This job answers that
  # question with no environment and no write permission, so the approval is
  # only ever requested for a push that will actually do something.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pending
        run: |
          # A changeset waiting in the tree means the version pull request has
          # to be opened or refreshed. Everything else is a question for the
          # registry, because `changeset publish` decides what to publish by
          # asking npm which versions exist, not by reading the git history.
          if [ -n "$(find .changeset -name '*.md' ! -name 'README.md')" ]; then
            echo "a changeset is waiting: the version pull request needs a run"
            echo "pending=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for manifest in packages/*/package.json; do
            # Private packages are the ones `changeset publish` skips, so they
            # are the ones this check skips to agree with it.
            if [ "$(jq -r '.private // false' "$manifest")" = true ]; then
              continue
            fi
            name=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")
            # The slash in a scoped name is encoded in the registry path.
            status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
              "https://registry.npmjs.org/${name//\//%2f}/$version")
            if [ "$status" != 200 ]; then
              # 404 is a version this repository has not published yet. Any
              # other answer, including the 000 curl reports for a network
              # failure, is unknown — and the safe unknown asks the human
              # rather than silently skipping a release.
              echo "$name@$version is not on the registry (HTTP $status)"
              echo "pending=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "no changeset waiting, every version published: nothing to do"
          echo "pending=false" >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    if: needs.preflight.outputs.pending == 'true'
    runs-on: ubuntu-latest
    # Two releases must never publish at once, and cancelling one mid-publish
    # would leave the registry and the git tags disagreeing. This sits on the
    # job rather than the workflow so that a push with nothing to release is
    # not held in the queue behind a run waiting on its approval — and then
    # cancelled by the push after it.
    concurrency:
      group: release
      cancel-in-progress: false
    # The environment name is half of what npm authenticates. A trusted
    # publisher names the repository, the workflow file and the environment, so
    # renaming any of the three stops the publish rather than weakening it. The
    # required reviewers on it are the human gate; `prevent self-review` cannot
    # be set while one person is the only reviewer, since the merge that
    # triggers the run also disqualifies them from approving it.
    environment: npm
    permissions:
      contents: write # push the version commit, the tags, and the releases
      pull-requests: write # open and update the version pull request
      id-token: write # mint the OIDC token npm publishes against
    steps:
      # Third-party actions are pinned by commit. A tag or branch reference is
      # mutable; `changesets/action@v2` is a branch, not a tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # No dependency cache here on purpose: a cache this job restores can be
      # written by any other job in the repository, and this job publishes.
      # No `registry-url`: it writes an .npmrc holding `${NODE_AUTH_TOKEN}`,
      # and with no such token set pnpm used to send that placeholder as the
      # credential and get a 404 before OIDC could be tried. Fixed in pnpm
      # 11.1.3, but the registry it would configure is already the default, so
      # the setting only buys back a failure mode.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # Every dependency is public, so the install needs no credential, and
      # --ignore-scripts keeps dependency code from executing in the one job
      # that has one. pnpm already blocks these by default; this is explicit.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # ci.yml runs on the same push, but nothing orders it before publishing,
      # and the version pull request gets no ci run of its own: GitHub does not
      # trigger workflows for events raised by the default token.
      - run: pnpm test
      # The published surface is subpath exports, which no test can see: they
      # import through source. Publishing without this check can ship a package
      # that resolves for nobody.
      - run: pnpm build
      - run: pnpm lint:packages

      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # One package.json script, not a chain: the action execs this without
          # a shell, so an `&&` written here is passed to the first command as
          # an argument rather than chaining the second. --lockfile-only
          # rewrites the lockfile for the bumped versions without linking
          # node_modules or running anything from a dependency.
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        # No npm credential of any kind: the publish authenticates as this
        # workflow through OIDC, against the trusted publisher configured on
        # each package. Provenance needs no flag either — npm attests a trusted
        # publish by default, which is the only way to attest one at all.
